<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONAIR SYSTEM TERMINAL</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+JP:wght@300;400&family=Noto+Sans+SC:wght@300;400&family=Noto+Sans+TC:wght@300;400&display=swap');
  :root{--cyan:#00e5cc;--cyan-dim:#00b8a4;--cyan-dark:#007a6d;--cyan-glow:rgba(0,229,204,0.12);--bg:#080e10;--bg-panel:#0c1416;--bg-card:#0f1a1c;--border:rgba(0,229,204,0.22);--border-bright:rgba(0,229,204,0.55);--text-main:#c8f0eb;--text-dim:#5a8c85;--text-muted:#2e5550;--amber:#e8a020;--amber-dim:rgba(232,160,32,0.13);--red:#e84040;--font-body:'Noto Sans JP',sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text-main);font-family:var(--font-body);font-weight:300;min-height:100vh;overflow-x:hidden;position:relative}
  body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.15) 2px,rgba(0,0,0,0.15) 4px);pointer-events:none;z-index:999}
  .container{max-width:860px;margin:0 auto;padding:40px 24px 80px;position:relative;z-index:1}
  .header{text-align:center;margin-bottom:36px}
  .header-logo{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:.28em;color:var(--text-dim);margin-bottom:10px}
  .header-title{font-family:'Share Tech Mono',monospace;font-size:26px;letter-spacing:.15em;color:var(--cyan);margin-bottom:4px}
  .header-sub{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--text-dim);letter-spacing:.2em}
  .header-line{width:100%;height:1px;background:linear-gradient(90deg,transparent,var(--border-bright),transparent);margin-top:20px}
  .status-bar{display:flex;justify-content:space-between;align-items:center;font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--text-dim);letter-spacing:.15em;margin-top:8px}
  .status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--cyan);margin-right:6px;animation:blink 2s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
  .lang-bar{display:flex;justify-content:center;gap:0;margin-bottom:32px;border:1px solid var(--border-bright);border-radius:3px;overflow:hidden;width:fit-content;margin-left:auto;margin-right:auto}
  .lang-btn{font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:.2em;padding:10px 24px;background:transparent;color:var(--text-dim);border:none;border-right:1px solid var(--border-bright);cursor:pointer;transition:all .18s}
  .lang-btn:last-child{border-right:none}
  .lang-btn.active{background:rgba(0,229,204,.1);color:var(--cyan)}
  .lang-btn:hover:not(.active){color:var(--text-main);background:rgba(0,229,204,.04)}
  .section-label{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:.3em;color:var(--cyan-dim);margin-bottom:14px;display:flex;align-items:center;gap:10px}
  .section-label::after{content:'';flex:1;height:1px;background:var(--border)}
  .qa-section{margin-bottom:48px}
  .qa-item{border:1px solid var(--border);border-radius:4px;margin-bottom:8px;overflow:hidden;background:var(--bg-card);transition:border-color .2s}
  .qa-item:hover{border-color:rgba(0,229,204,.4)}
  .qa-question{padding:14px 18px;cursor:pointer;display:flex;align-items:center;gap:12px;user-select:none}
  .qa-q-tag{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--cyan);letter-spacing:.1em;flex-shrink:0;border:1px solid var(--cyan-dark);padding:2px 7px;border-radius:2px}
  .qa-q-text{font-size:14px;color:var(--text-main);flex:1;line-height:1.5}
  .qa-chevron{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--text-dim);transition:transform .25s;flex-shrink:0}
  .qa-item.open .qa-chevron{transform:rotate(180deg);color:var(--cyan)}
  .qa-item.open{border-color:var(--border-bright)}
  .qa-item.open .qa-q-text{color:var(--cyan)}
  .qa-answer{max-height:0;overflow:hidden;transition:max-height .35s ease;border-top:1px solid transparent}
  .qa-item.open .qa-answer{max-height:500px;border-top-color:var(--border)}
  .qa-answer-inner{padding:16px 18px 18px;display:flex;gap:12px}
  .qa-a-tag{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--amber);letter-spacing:.1em;flex-shrink:0;border:1px solid rgba(232,160,32,.3);padding:2px 7px;border-radius:2px;height:fit-content}
  .qa-a-text{font-size:13px;color:var(--text-main);line-height:1.85;opacity:.9}
  .qa-note{font-size:12px;color:var(--amber);background:var(--amber-dim);border:1px solid rgba(232,160,32,.2);border-radius:3px;padding:8px 12px;margin-top:8px;font-family:'Share Tech Mono',monospace;letter-spacing:.08em;line-height:1.6}
  .pagination{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:20px}
  .page-btn{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.15em;color:var(--text-dim);border:1px solid var(--border);background:none;padding:8px 16px;border-radius:3px;cursor:pointer;transition:all .18s}
  .page-btn:hover:not(:disabled){color:var(--cyan);border-color:var(--cyan-dim)}
  .page-btn:disabled{opacity:.25;cursor:not-allowed}
  .page-indicator{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--text-dim);letter-spacing:.2em;min-width:80px;text-align:center}
  .letter-section{margin-bottom:48px}
  .terminal-box{background:var(--bg-panel);border:1px solid var(--border);border-radius:4px;overflow:hidden}
  .terminal-titlebar{background:rgba(0,229,204,.05);border-bottom:1px solid var(--border);padding:8px 14px;font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--text-dim);letter-spacing:.2em;display:flex;align-items:center;gap:8px}
  .terminal-body{padding:20px}
  .form-row{margin-bottom:14px}
  .form-label{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--text-dim);letter-spacing:.2em;margin-bottom:6px;display:block}
  .form-input,.form-textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text-main);font-family:var(--font-body);font-weight:300;font-size:13px;padding:10px 12px;border-radius:3px;outline:none;transition:border-color .2s;caret-color:var(--cyan)}
  .form-input:focus,.form-textarea:focus{border-color:var(--border-bright);box-shadow:0 0 0 2px var(--cyan-glow)}
  .form-textarea{resize:vertical;min-height:100px;line-height:1.7}
  .form-input::placeholder,.form-textarea::placeholder{color:var(--text-muted);font-size:12px}
  .form-row-inline{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
  .submit-btn{width:100%;padding:12px;background:transparent;border:1px solid var(--cyan-dim);color:var(--cyan);font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:.25em;cursor:pointer;border-radius:3px;transition:all .2s;margin-top:6px}
  .submit-btn:hover{background:var(--cyan-glow);border-color:var(--cyan)}
  .notice-box{background:var(--amber-dim);border:1px solid rgba(232,160,32,.22);border-radius:3px;padding:10px 14px;font-size:11px;color:var(--amber);font-family:'Share Tech Mono',monospace;letter-spacing:.08em;line-height:1.8;margin-bottom:16px}
  .confirm-flash{display:none;text-align:center;padding:28px;font-family:'Share Tech Mono',monospace;font-size:13px;color:var(--cyan);letter-spacing:.2em;animation:fadeIn .4s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .msg-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px}
  .msg-name{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--cyan);letter-spacing:.15em}
  .msg-email{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--text-dim);letter-spacing:.1em}
  .msg-time{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--text-muted)}
  .msg-body{font-size:13px;color:var(--text-main);line-height:1.7;opacity:.85}
  body.cjk .section-label,body.cjk .notice-box,body.cjk .lang-btn,body.cjk .submit-btn,body.cjk .page-btn,body.cjk .terminal-titlebar,body.cjk .form-label,body.cjk .header-logo,body.cjk .header-sub,body.cjk .status-bar{font-family:var(--font-body);letter-spacing:.05em}
  html::-webkit-scrollbar{width:6px}
  html::-webkit-scrollbar-track{background:var(--bg)}
  html::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

  /* CHAT */
  .chat-section{margin-bottom:48px}
  .status-banner{padding:14px 18px;border-radius:4px;font-family:"Share Tech Mono",monospace;font-size:12px;letter-spacing:.15em;display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .status-banner.online{background:rgba(0,229,204,.08);border:1px solid var(--border-bright);color:var(--cyan)}
  .status-banner.busy{background:rgba(232,160,32,.1);border:1px solid rgba(232,160,32,.3);color:var(--amber)}
  .status-banner.offline{background:rgba(80,80,80,.15);border:1px solid rgba(150,150,150,.25);color:var(--text-dim)}
  .status-indicator{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .status-indicator.online{background:var(--cyan);animation:blink 2s infinite}
  .status-indicator.busy{background:var(--amber)}
  .status-indicator.offline{background:#666}
  .status-redirect{font-size:11px;opacity:.75;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .chat-log{max-height:360px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:14px;padding:14px;background:var(--bg-panel);border:1px solid var(--border);border-radius:4px}
  .chat-log::-webkit-scrollbar{width:4px}
  .chat-log::-webkit-scrollbar-track{background:var(--bg)}
  .chat-log::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
  .chat-bubble-wrap{display:flex;flex-direction:column}
  .chat-bubble-wrap.visitor{align-items:flex-start}
  .chat-bubble-wrap.admin{align-items:flex-end}
  .chat-meta{font-family:"Share Tech Mono",monospace;font-size:10px;color:var(--text-muted);margin-bottom:3px;padding:0 2px}
  .chat-bubble{max-width:78%;padding:10px 14px;border-radius:4px;font-size:13px;line-height:1.75}
  .chat-bubble.visitor{background:var(--bg-card);border:1px solid var(--border);color:var(--text-main)}
  .chat-bubble.admin{background:rgba(0,229,204,.07);border:1px solid var(--border-bright);color:var(--cyan)}
  .chat-empty{text-align:center;padding:32px;font-family:"Share Tech Mono",monospace;font-size:11px;color:var(--text-muted);letter-spacing:.2em}
  .chat-input-row{display:flex;gap:8px}
  .chat-input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text-main);font-family:"Noto Sans JP",sans-serif;font-size:13px;padding:10px 12px;border-radius:3px;outline:none;transition:border-color .2s;caret-color:var(--cyan)}
  .chat-input:focus{border-color:var(--border-bright);box-shadow:0 0 0 2px var(--cyan-glow)}
  .chat-input:disabled{opacity:.35;cursor:not-allowed}
  .chat-send-btn{font-family:"Share Tech Mono",monospace;font-size:11px;letter-spacing:.15em;color:var(--cyan);border:1px solid var(--cyan-dim);background:none;padding:10px 18px;border-radius:3px;cursor:pointer;transition:all .2s;white-space:nowrap}
  .chat-send-btn:hover:not(:disabled){background:var(--cyan-glow)}
  .chat-send-btn:disabled{opacity:.3;cursor:not-allowed}
  /* ADMIN */
  .admin-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:rgba(0,229,204,.05);border:1px solid var(--border);border-radius:4px;margin-bottom:20px}
  .admin-bar-left{font-family:"Share Tech Mono",monospace;font-size:11px;color:var(--cyan);letter-spacing:.15em;display:flex;align-items:center;gap:8px}
  .admin-bar-right{display:flex;gap:8px;align-items:center}
  .status-btn{font-family:"Share Tech Mono",monospace;font-size:10px;letter-spacing:.12em;border:1px solid var(--border);background:none;padding:6px 12px;border-radius:3px;cursor:pointer;transition:all .2s}
  .status-btn.active-online{color:var(--cyan);border-color:var(--cyan-dim);background:rgba(0,229,204,.08)}
  .status-btn.active-busy{color:var(--amber);border-color:rgba(232,160,32,.4);background:rgba(232,160,32,.08)}
  .status-btn.active-offline{color:var(--text-dim);border-color:var(--border)}
  .status-btn:not(.active-online):not(.active-busy):not(.active-offline){color:var(--text-muted)}
  .status-btn:hover{color:var(--text-main)}
  .admin-logout{font-family:"Share Tech Mono",monospace;font-size:10px;color:var(--text-muted);border:1px solid var(--border);background:none;padding:6px 12px;border-radius:3px;cursor:pointer;transition:all .2s;letter-spacing:.12em}
  .admin-logout:hover{color:var(--cyan);border-color:var(--cyan-dim)}
  .admin-threads{display:flex;flex-direction:column;gap:10px}
  .thread-card{background:var(--bg-card);border:1px solid var(--border);border-radius:4px;overflow:hidden}
  .thread-header{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:background .15s}
  .thread-header:hover{background:rgba(0,229,204,.03)}
  .thread-name{font-family:"Share Tech Mono",monospace;font-size:11px;color:var(--cyan);letter-spacing:.12em}
  .thread-email{font-family:"Share Tech Mono",monospace;font-size:10px;color:var(--text-dim);margin-left:8px}
  .thread-time{font-family:"Share Tech Mono",monospace;font-size:10px;color:var(--text-muted)}
  .thread-preview{font-size:12px;color:var(--text-dim);margin-top:3px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:400px}
  .thread-body{display:none;border-top:1px solid var(--border)}
  .thread-body.open{display:block}
  .thread-log{max-height:260px;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
  .thread-log::-webkit-scrollbar{width:3px}
  .thread-log::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
  .thread-reply-row{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--border);background:rgba(0,229,204,.02)}
  .unread-dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);flex-shrink:0;animation:blink 1.5s infinite}
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="header-logo">373 STUDIO — BITSUMMIT 2026</div>
    <div class="header-title">ON AIR TERMINAL</div>
    <div class="header-sub">放送開始！タクシー推理事件簿</div>
    <div class="header-line"></div>
    <div class="status-bar">
      <span><span class="status-dot"></span>SYSTEM ONLINE</span>
      <span id="clock">--:--:--</span>
      <span>KYOTO, JAPAN</span>
    </div>
  </div>

  <div class="lang-bar">
    <button class="lang-btn active" id="btn-ja" onclick="setLang('ja')">日本語</button>
    <button class="lang-btn" id="btn-en" onclick="setLang('en')">ENGLISH</button>
    <button class="lang-btn" id="btn-zh" onclick="setLang('zh')">简体中文</button>
    <button class="lang-btn" id="btn-tw" onclick="setLang('tw')">繁體中文</button>
  </div>

  <div class="qa-section">
    <div class="section-label" id="qa-label">FAQ // よくある質問</div>
    <div id="qa-list"></div>
    <div class="pagination">
      <button class="page-btn" id="prev-btn" onclick="changePage(-1)" disabled>◀ 前へ</button>
      <span class="page-indicator" id="page-indicator">01 / 04</span>
      <button class="page-btn" id="next-btn" onclick="changePage(1)">次へ ▶</button>
    </div>
  </div>

  <!-- VISITOR VIEW -->
  <div id="visitor-view">

    <!-- REALTIME CHAT -->
    <div class="chat-section">
      <div class="section-label" id="chat-label">LIVE CHAT // リアルタイムチャット</div>
      <div id="status-banner" class="status-banner offline">
        <span class="status-indicator offline" id="status-dot"></span>
        <span id="status-text">— —</span>
      </div>
      <div id="chat-area">
        <div class="chat-log" id="chat-log">
          <div class="chat-empty" id="chat-empty-msg">—</div>
        </div>
        <div class="chat-input-row">
          <input class="chat-input" id="chat-input" placeholder="—" disabled onkeydown="if(event.key==='Enter')sendChat()">
          <button class="chat-send-btn" id="chat-send-btn" onclick="sendChat()" disabled>SEND</button>
        </div>
      </div>
    </div>

    <!-- MESSAGE FORM -->
    <div class="letter-section">
      <div class="section-label" id="msg-label">MESSAGE // 匿名メッセージ</div>
      <div class="terminal-box" id="msg-box">
        <div class="terminal-titlebar">
          <span class="status-dot"></span>
          <span id="form-title">MESSAGE TRANSMISSION INTERFACE</span>
        </div>
        <div class="terminal-body">
          <div class="notice-box" id="notice-text"></div>
          <div id="form-area">
            <div class="form-row">
              <label class="form-label" id="label-msg">メッセージ *</label>
              <textarea class="form-textarea" id="msg-body" placeholder="ゲームへの感想、質問、なんでもどうぞ…"></textarea>
            </div>
            <div class="form-row-inline">
              <div>
                <label class="form-label" id="label-name">お名前 (任意)</label>
                <input class="form-input" id="msg-name" type="text" placeholder="匿名">
              </div>
              <div>
                <label class="form-label" id="label-email">メールアドレス (任意)</label>
                <input class="form-input" id="msg-email" type="email" placeholder="reply@example.com">
              </div>
            </div>
            <button class="submit-btn" id="submit-btn" onclick="submitMessage()">▶ 送信する</button>
          </div>
          <div class="confirm-flash" id="confirm-msg"></div>
        </div>
      </div>
    </div>

  </div><!-- /visitor-view -->

  <!-- ADMIN LOGIN SCREEN -->
  <div id="admin-login" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:16px">
    <div style="font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--cyan);letter-spacing:.3em;margin-bottom:8px">ADMIN ACCESS</div>
    <input id="admin-pass-input" type="password" placeholder="PASSWORD" style="background:var(--bg-panel);border:1px solid var(--border-bright);color:var(--text-main);font-family:'Share Tech Mono',monospace;font-size:14px;padding:12px 20px;border-radius:3px;outline:none;caret-color:var(--cyan);text-align:center;letter-spacing:.2em;width:260px" onkeydown="if(event.key==='Enter')window.checkAdminPass()">
    <button onclick="window.checkAdminPass()" style="font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.25em;color:var(--cyan);border:1px solid var(--cyan-dim);background:none;padding:10px 28px;border-radius:3px;cursor:pointer">ENTER</button>
    <div id="admin-pass-err" style="font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--red);letter-spacing:.15em;display:none">WRONG PASSWORD</div>
  </div>

  <!-- ADMIN VIEW -->
  <div id="admin-view" style="display:none">
    <div class="admin-bar">
      <div class="admin-bar-left">
        <span class="status-dot"></span>ADMIN MODE
      </div>
      <div class="admin-bar-right">
        <button class="status-btn" id="abtn-online" onclick="setStatus('online')">● ONLINE</button>
        <button class="status-btn" id="abtn-busy" onclick="setStatus('busy')">● BUSY</button>
        <button class="status-btn" id="abtn-offline" onclick="setStatus('offline')">● OFFLINE</button>
        <button class="admin-logout" onclick="adminLogout()">LOGOUT</button>
      </div>
    </div>
    <div class="section-label">THREADS // チャット履歴</div>
    <div id="admin-threads" class="admin-threads"></div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onValue, set, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCA6gr3dPm9shfRlgaxqeDfmhENkQrgrqQ",
  authDomain: "onair-terminal-talk.firebaseapp.com",
  databaseURL: "https://onair-terminal-talk-default-rtdb.firebaseio.com",
  projectId: "onair-terminal-talk",
  storageBucket: "onair-terminal-talk.firebasestorage.app",
  messagingSenderId: "383295900300",
  appId: "1:383295900300:web:ed6dd9103558b1916989a9"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const ADMIN_PASS = '5v2n8s3e';
const isAdmin = new URLSearchParams(location.search).get('admin')=== 'true';

const QA=[
  {
    ja:{q:"このゲームはどうやって遊べますか？並ばないといけませんか？",a:"整理券をお受け取りいただき、番号が呼ばれるまでお待ちください。1回のプレイ時間は約30分です。"},
    en:{q:"How can I play here? Do I need to line up?",a:"Please take a numbered ticket and wait to be called. Each play session is about 30 minutes."},
    zh:{q:"要怎么玩这个游戏，要排队吗？",a:"需要拿整理券等候叫号。每次试玩时间约30分钟。"},
    tw:{q:"要怎麼玩這個遊戲，要排隊嗎？",a:"需要拿整理券等候叫號。每次試玩時間約30分鐘。"}

function setLang(l){
  lang=l;openIndex=null;currentPage=0;
  ['ja','en','zh','tw'].forEach(k=>document.getElementById('btn-'+k).classList.toggle('active',k===l));
  document.documentElement.style.setProperty('--font-body',FONTS[l]);
  document.body.classList.toggle('cjk',l==='zh'||l==='tw');
  applyUI();renderQA();updateStatusBanner(currentStatus);
}

function applyUI(){
  const t=UI[lang];
  document.getElementById('qa-label').textContent=t.qaLabel;
  document.getElementById('chat-label').textContent=CHAT_LABEL[lang];
  document.getElementById('msg-label').textContent=t.msgLabel;
  document.getElementById('form-title').textContent=t.formTitle;
  document.getElementById('notice-text').innerHTML=t.notice;
  document.getElementById('label-msg').textContent=t.labelMsg;
  document.getElementById('label-name').textContent=t.labelName;
  document.getElementById('label-email').textContent=t.labelEmail;
  document.getElementById('submit-btn').textContent=t.submitBtn;
  document.getElementById('confirm-msg').innerHTML=t.confirmMain+'<span style="font-size:10px;color:var(--text-dim);margin-top:6px;display:block;">'+t.confirmSub+'</span>';
  document.getElementById('msg-body').placeholder=t.placeholder;
  document.getElementById('msg-name').placeholder=t.placeholderName;
  document.getElementById('prev-btn').textContent=t.prevBtn;
  document.getElementById('next-btn').textContent=t.nextBtn;
}

function renderQA(){

  const total=QA.length,tp=Math.ceil(total/PER_PAGE);
  const start=currentPage*PER_PAGE,end=Math.min(start+PER_PAGE,total);
  QA.slice(start,end).forEach((item,li)=>{
    const gi=start+li,d=item[lang];
    const el=document.createElement('div');
    el.className='qa-item'+(openIndex===gi?' open':'');
    el.innerHTML='<div class="qa-question" onclick="window.toggleQA('+gi+')"><span class="qa-q-tag">Q'+String(gi+1).padStart(2,'0')+'</span><span class="qa-q-text">'+esc(d.q)+'</span><span class="qa-chevron">▾</span></div><div class="qa-answer"><div class="qa-answer-inner"><span class="qa-a-tag">ANS</span><span class="qa-a-text">'+( d.a?esc(d.a):'')+( d.note?'<div class="qa-note">'+d.note+'</div>':'')+'</span></div></div>';
    list.appendChild(el);
  });
  document.getElementById('page-indicator').textContent=String(currentPage+1).padStart(2,'0')+' / '+String(tp).padStart(2,'0');
  document.getElementById('prev-btn').disabled=currentPage===0;
  document.getElementById('next-btn').disabled=currentPage>=tp-1;
}
window.toggleQA=function(gi){openIndex=openIndex===gi?null:gi;renderQA();}
window.changePage=function(dir){const tp=Math.ceil(QA.length/PER_PAGE);currentPage=Math.max(0,Math.min(tp-1,currentPage+dir));openIndex=null;renderQA();}

// ── STATUS BANNER ──
function updateStatusBanner(status){
  currentStatus=status;
  const banner=document.getElementById('status-banner');
  const dot=document.getElementById('status-dot');
  const text=document.getElementById('status-text');
  const input=document.getElementById('chat-input');
  const sendBtn=document.getElementById('chat-send-btn');
  const st=STATUS_TEXT[lang];
  banner.className='status-banner '+status;
  dot.className='status-indicator '+status;
  if(status==='online'){
    text.innerHTML=st.online;
    input.disabled=false;input.placeholder=st.placeholder_online;
    sendBtn.disabled=false;
  } else {
    const redirect='<span class="status-redirect" onclick="document.getElementById('msg-box').scrollIntoView({behavior:'smooth'})">'+st.redirect+'</span>';
    text.innerHTML=st[status]+' '+redirect;
    input.disabled=true;input.placeholder='—';
    sendBtn.disabled=true;
  }
}

// ── VISITOR CHAT ──
function initVisitorChat(){
  // Listen to status
  onValue(ref(db,'status'),(snap)=>{
    updateStatusBanner(snap.val()||'offline');
  });
  // If visitor has a session, listen to replies
  const savedKey=sessionStorage.getItem('onair_session');
  if(savedKey){
    visitorSessionKey=savedKey;
    listenVisitorThread(savedKey);
  }
}

function listenVisitorThread(key){
  onValue(ref(db,'chats/'+key+'/messages'),(snap)=>{
    const data=snap.val();
    const log=document.getElementById('chat-log');
    const empty=document.getElementById('chat-empty-msg');
    if(!data){return;}
    empty.style.display='none';
    const msgs=Object.values(data).sort((a,b)=>a.ts-b.ts);
    log.innerHTML=msgs.map(m=>`
      <div class="chat-bubble-wrap ${m.role}">
        <div class="chat-meta">${m.role==='admin'?'373 STUDIO':esc(m.name||'You')} · ${m.time}</div>
        <div class="chat-bubble ${m.role}">${esc(m.body)}</div>
      </div>
    `).join('');
    log.scrollTop=log.scrollHeight;
  });
}

window.sendChat=async function(){
  const input=document.getElementById('chat-input');
  const body=input.value.trim();
  if(!body||currentStatus!=='online')return;
  input.disabled=true;
  const time=new Date().toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit'});
  if(!visitorSessionKey){
    const newRef=push(ref(db,'chats'));
    visitorSessionKey=newRef.key;
    sessionStorage.setItem('onair_session',visitorSessionKey);
    await set(ref(db,'chats/'+visitorSessionKey+'/meta'),{time,lang,unread:true});
    listenVisitorThread(visitorSessionKey);
  }
  await push(ref(db,'chats/'+visitorSessionKey+'/messages'),{role:'visitor',name:'Guest',body,time,ts:Date.now()});
  await set(ref(db,'chats/'+visitorSessionKey+'/meta/unread'),true);
  await set(ref(db,'chats/'+visitorSessionKey+'/meta/lastMsg'),body);
  await set(ref(db,'chats/'+visitorSessionKey+'/meta/lastTime'),time);
  input.value='';input.disabled=false;input.focus();
}

// ── VISITOR MESSAGE FORM ──
window.submitMessage=async function(){
  const body=document.getElementById('msg-body').value.trim();
  if(!body){document.getElementById('msg-body').focus();return;}
  const name=document.getElementById('msg-name').value.trim()||'Anonymous';
  const email=document.getElementById('msg-email').value.trim();
  const time=new Date().toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'});
  const btn=document.getElementById('submit-btn');btn.disabled=true;
  try{
    await fetch('https://formspree.io/f/mgoddjgq',{
      method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({name,email,message:body,time,lang})
    });
    document.getElementById('form-area').style.display='none';
    document.getElementById('confirm-msg').style.display='block';
    setTimeout(()=>{
      document.getElementById('confirm-msg').style.display='none';
      document.getElementById('form-area').style.display='block';
      document.getElementById('msg-body').value='';
      document.getElementById('msg-name').value='';
      document.getElementById('msg-email').value='';
    },3000);
  }catch(e){alert('送信に失敗しました。');}
  btn.disabled=false;
}

// ── ADMIN ──
window.checkAdminPass=function(){
  const val=document.getElementById('admin-pass-input').value;
  if(val===ADMIN_PASS){
    document.getElementById('admin-login').style.display='none';
    document.getElementById('visitor-view').style.display='none';
    document.getElementById('admin-view').style.display='block';
    loadAdminView();
  } else {
    document.getElementById('admin-pass-err').style.display='block';
    document.getElementById('admin-pass-input').value='';
    document.getElementById('admin-pass-input').focus();
  }
}

function initAdmin(){
  document.getElementById('visitor-view').style.display='none';
  document.getElementById('admin-login').style.display='flex';
  setTimeout(()=>document.getElementById('admin-pass-input').focus(),100);
}

function loadAdminView(){
  document.getElementById('visitor-view').style.display='none';
  document.getElementById('admin-view').style.display='block';
  // Sync current status
  onValue(ref(db,'status'),(snap)=>{
    const s=snap.val()||'offline';
    ['online','busy','offline'].forEach(k=>{
      const btn=document.getElementById('abtn-'+k);
      btn.className='status-btn'+(s===k?' active-'+k:'');
    });
  });
  // Listen to all chat threads
  onValue(ref(db,'chats'),(snap)=>{
    const data=snap.val();
    const container=document.getElementById('admin-threads');
    if(!data){container.innerHTML='<div style="text-align:center;padding:40px;font-family:Share Tech Mono,monospace;font-size:11px;color:var(--text-muted);letter-spacing:.2em">NO CONVERSATIONS YET</div>';return;}
    const threads=Object.entries(data).map(([k,v])=>({...v,_key:k})).sort((a,b)=>(b.meta?.lastTime||'')<(a.meta?.lastTime||'')?-1:1);
    container.innerHTML=threads.map(t=>{
      const msgs=t.messages?Object.values(t.messages).sort((a,b)=>a.ts-b.ts):[];
      const last=msgs[msgs.length-1];
      return `<div class="thread-card">
        <div class="thread-header" onclick="window.toggleThread('${t._key}')">
          <div>
            <div style="display:flex;align-items:center;gap:6px">
              ${t.meta?.unread?'<span class="unread-dot"></span>':''}
              <span class="thread-name">SESSION ${t._key.slice(-6).toUpperCase()}</span>
              <span style="font-family:Share Tech Mono,monospace;font-size:10px;color:var(--text-dim)">[${t.meta?.lang||'?'}]</span>
            </div>
            <div class="thread-preview">${last?esc(last.body):'—'}</div>
          </div>
          <span class="thread-time">${t.meta?.lastTime||''}</span>
        </div>
        <div class="thread-body" id="thread-${t._key}">
          <div class="thread-log" id="thread-log-${t._key}">
            ${msgs.map(m=>`<div class="chat-bubble-wrap ${m.role}"><div class="chat-meta">${m.role==='admin'?'373 STUDIO':'Guest'} · ${m.time}</div><div class="chat-bubble ${m.role}">${esc(m.body)}</div></div>`).join('')}
          </div>
          <div class="thread-reply-row">
            <input class="chat-input" id="admin-input-${t._key}" placeholder="返信を入力… / Reply…" onkeydown="if(event.key==='Enter')window.adminReply('${t._key}')">
            <button class="chat-send-btn" onclick="window.adminReply('${t._key}')">SEND</button>
          </div>
        </div>
      </div>`;
    }).join('');
  });
}

window.toggleThread=function(key){
  const body=document.getElementById('thread-'+key);
  body.classList.toggle('open');
  if(body.classList.contains('open')){
    set(ref(db,'chats/'+key+'/meta/unread'),false);
    const log=document.getElementById('thread-log-'+key);
    log.scrollTop=log.scrollHeight;
    document.getElementById('admin-input-'+key).focus();
  }
}

window.adminReply=async function(key){
  const input=document.getElementById('admin-input-'+key);
  const body=input.value.trim();if(!body)return;
  const time=new Date().toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit'});
  await push(ref(db,'chats/'+key+'/messages'),{role:'admin',body,time,ts:Date.now()});
  await set(ref(db,'chats/'+key+'/meta/lastMsg'),'[373 STUDIO] '+body);
  await set(ref(db,'chats/'+key+'/meta/lastTime'),time);
  input.value='';
}

window.setStatus=async function(s){
  await set(ref(db,'status'),s);
}
window.adminLogout=function(){location.href=location.pathname;}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})}

// INIT
updateStatusBanner('offline');
if(isAdmin){initAdmin();}else{initVisitorChat();}
applyUI();renderQA();updateClock();setInterval(updateClock,1000);
</script>
</body>
